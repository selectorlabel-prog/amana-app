<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Amana admin">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="amana_admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>amana_admin</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="amana-boot" style="font-family:Tahoma,Arial,sans-serif;direction:rtl;text-align:center;margin-top:28vh;color:#00355F;">
    <div style="font-size:22px;font-weight:700;margin-bottom:12px;">أمانة — الإدارة</div>
    <div style="font-size:15px;color:#5f6b76;">جاري تحميل لوحة الإدارة…</div>
  </div>
  <script>
    (function () {
      function hideBoot() {
        var el = document.getElementById('amana-boot');
        if (el) el.remove();
      }
      function flutterMounted() {
        return !!(document.querySelector('flutter-view') ||
          document.querySelector('flt-glass-pane') ||
          document.querySelector('flt-scene-host') ||
          document.querySelector('flt-renderer'));
      }
      window.addEventListener('flutter-first-frame', hideBoot);
      var polls = 0;
      var timer = setInterval(function () {
        polls += 1;
        if (flutterMounted()) {
          clearInterval(timer);
          hideBoot();
          return;
        }
        if (polls >= 40) {
          clearInterval(timer);
          var el = document.getElementById('amana-boot');
          if (!el) return;
          el.style.color = '#BA1A1A';
          el.innerHTML =
            '<div style="font-size:22px;font-weight:700;margin-bottom:12px;">تعذّر تحميل لوحة الإدارة</div>' +
            '<div style="font-size:15px;color:#5f6b76;max-width:360px;margin:0 auto;line-height:1.6;">' +
            'محرك Flutter لم يبدأ. أعد تشغيل المعاينة على المنفذ 7390.' +
            '</div>';
        }
      }, 250);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
