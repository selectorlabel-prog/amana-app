<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Amana - Payment Confirmation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {

                        "primary-fixed": "#d2e4ff",

                        "on-tertiary-container": "#61cbbc",
                        "sand-accent": "#F4A261",
                        "secondary": "#8e4e14",
                        "surface-container-low": "#f6f3f2",
                        "surface": "#fcf9f8",
                        "surface-container-highest": "#e5e2e1",
                        "on-background": "#1b1c1c",
                        "tertiary": "#003b34",
                        "secondary-fixed": "#ffdcc4",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#eae7e7",
                        "primary-fixed-dim": "#a0c9ff",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#6f3800",
                        "nile-blue-deep": "#0A2E4D",
                        "inverse-on-surface": "#f3f0ef",
                        "warning-amber": "#FFBF00",
                        "outline": "#727780",
                        "surface-white": "#FFFFFF",
                        "on-tertiary-fixed-variant": "#005048",
                        "surface-bright": "#fcf9f8",
                        "surface-tint": "#2d6197",
                        "on-tertiary-fixed": "#00201c",
                        "surface-gray-light": "#F8F9FA",
                        "secondary-container": "#ffab69",
                        "inverse-surface": "#303030",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#6fd8c8",
                        "success-green": "#27A745",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#42474f",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#1b1c1c",
                        "outline-variant": "#c2c7d1",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "lg": "24px",
                        "sm": "12px",

                        "md": "16px",
                        "margin-mobile": "16px",

                    "fontFamily": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-filled {
            font-variation-settings: 'FILL' 1;
        }
        .success-pulse {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col items-center pt-xl px-margin-mobile pb-xl">
<!-- Success Illustration Area -->
<div class="relative flex flex-col items-center justify-center mt-xl mb-lg w-full max-w-md">
<div class="relative flex items-center justify-center w-24 h-24 mb-md">
<div class="absolute inset-0 rounded-full bg-success-green/20 success-pulse"></div>
<div class="absolute inset-2 rounded-full bg-success-green/40"></div>
<div class="relative flex items-center justify-center w-16 h-16 rounded-full bg-success-green text-surface-white shadow-lg">
<span class="material-symbols-outlined icon-filled text-4xl">check_circle</span>
</div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary text-center mb-base">تم الدفع بنجاح</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center">شكرًا لاستخدامك أمانة. تم إنجاز الخدمة بنجاح.</p>
</div>
<!-- Digital Invoice Card -->
<div class="w-full max-w-md bg-surface-white rounded-xl shadow-sm border border-outline-variant p-lg mb-xl relative overflow-hidden">
<!-- Receipt Top Decoration -->
<div class="absolute top-0 left-0 right-0 h-2 bg-[radial-gradient(circle_at_bottom,transparent_4px,#FFFFFF_5px)] bg-[length:12px_12px] bg-bottom"></div>
<div class="flex justify-between items-center mb-md pb-md border-b border-outline-variant/50 pt-xs">
<span class="font-label-md text-label-md text-on-surface-variant">رقم الفاتورة</span>
<span class="font-headline-md text-headline-md text-on-background">INV-2023-8942</span>
</div>
<div class="space-y-sm mb-md">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">التاريخ</span>
<span class="font-body-md text-body-md text-on-background">٢٤ أكتوبر ٢٠٢٣</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">مقدم الخدمة</span>
<span class="font-body-md text-body-md text-on-background">أحمد محمد (سباك)</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">طريقة الدفع</span>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-outline text-sm">account_balance_wallet</span>
<span class="font-body-md text-body-md text-on-background">المحفظة الإلكترونية</span>
</div>
</div>
</div>
<div class="mt-md pt-md border-t border-outline-variant/50 border-dashed flex justify-between items-center bg-surface-container-low -mx-lg px-lg pb-sm">
<span class="font-headline-md text-headline-md text-on-background mt-sm">المبلغ الإجمالي</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary mt-sm">١٥,٠٠٠ ج.س</span>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full max-w-md space-y-sm mt-auto">
<button class="w-full h-12 flex items-center justify-center gap-xs bg-surface-white border border-outline text-primary font-label-md text-label-md rounded-lg hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined">download</span>
            تحميل الفاتورة
        </button>
<button class="w-full h-12 flex items-center justify-center bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:bg-primary/90 transition-colors active:scale-[0.98] active:shadow-inner">
            العودة للرئيسية
        </button>
</div>
</body></html>
