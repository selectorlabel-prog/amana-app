<script>
        // Star Rating Logic
        const stars = document.querySelectorAll('.star-rating .material-symbols-outlined');
        const ratingText = document.getElementById('rating-text');
        const texts = ['سيء', 'مقبول', 'جيد', 'جيد جداً', 'ممتاز'];

        stars.forEach(star => {
            star.addEventListener('click', (e) => {
                const value = parseInt(e.target.getAttribute('data-value'));
                
                stars.forEach((s, index) => {
                    if (index < value) {
                        s.classList.add('active');
                    } else {
                        s.classList.remove('active');
                    }
                });
                
                ratingText.textContent = texts[value - 1];
            });
        });

        // Chips Logic
        const chips = document.querySelectorAll('.chip');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chip.classList.toggle('selected');
                if(chip.classList.contains('selected')){
                    chip.classList.remove('border-outline-variant', 'text-on-surface-variant', 'bg-surface-container-lowest');
                    chip.classList.add('border-primary-container', 'bg-primary-container', 'text-on-primary-container');
                } else {
                    chip.classList.add('border-outline-variant', 'text-on-surface-variant', 'bg-surface-container-lowest');
                    chip.classList.remove('border-primary-container', 'bg-primary-container', 'text-on-primary-container');
                }
            });
        });
    </script>
