<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            font-family: 'Noto Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .map-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background-color: #e5e3df; /* Fallback map color */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="relative h-screen w-full overflow-hidden flex flex-col">
<!-- Top App Bar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim text-primary dark:text-primary-fixed border-b border-outline-variant dark:border-outline flex justify-between items-center px-margin-mobile h-[64px] z-10 shadow-sm">
<div class="flex items-center gap-xs">
<button class="p-xs text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-[24px]">arrow_forward</span>
</button>
<h1 class="font-headline-md-mobile text-headline-md-mobile font-bold text-primary dark:text-primary-fixed">Amana</h1>
</div>
<div class="flex items-center gap-sm">
<button class="p-xs text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors active:scale-95 duration-100 relative">
<span class="material-symbols-outlined text-[24px]">notifications</span>
<span class="absolute top-2 right-2 w-2 h-2 bg-error-red rounded-full"></span>
</button>
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-outline">person</span>
</div>
</div>
</header>
<!-- Map Area (Canvas) -->
<main class="flex-grow relative z-0">
<!-- Static Map Image Placeholder -->
<div class="w-full h-full bg-cover bg-center" data-alt="A highly detailed top-down street map of Khartoum, Sudan, stylized in a modern, light-mode interface. The map features subtle gray and white roads contrasting against light beige land masses and pale blue water bodies representing the Nile. The aesthetic is clean and corporate, avoiding clutter, with a soft, diffused lighting effect. There is a distinct, vibrant blue path highlighted along the main roads, indicating a route." data-location="Khartoum, Sudan" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDvQ6hKg_E0jSHS4I_T-5OYvPqLbmn2elFv9dvwg-8TKxS4DARDFC8CZZ6OKxK2eGOFu5oT2X517F4Hpn-DNdkwbN0rRvwW37LjwqU1BZHdd2RR6Hw8nrI_0FHyDrSoxnccHyiMhGn69cWrhHZuBSS028Nu0rBmmr0m1jvJDYhI-vvHktfwLOdlDoclpbN9USOgCuCRwTJ6f3kR_L99FE-Rre1qldWUVWlf4s4vhRcNI2tk33j5SXKlyn92l2WsbDWHddMTmu6H2V_M')"></div>
<!-- Live Tracking Overlay Elements -->
<div class="absolute inset-0 pointer-events-none">
<!-- Customer Location Marker -->
<div class="absolute top-1/4 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="w-12 h-12 bg-surface rounded-full shadow-lg flex items-center justify-center border-2 border-primary animate-pulse">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
</div>
<!-- Provider Location Marker -->
<div class="absolute top-1/2 left-1/3 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="w-14 h-14 bg-white rounded-full shadow-lg flex items-center justify-center border-4 border-surface p-1 relative">
<img class="w-full h-full object-cover rounded-full" data-alt="A clear, professional close-up portrait of a friendly Sudanese man with a short beard, wearing a neat blue uniform. He is smiling warmly. The lighting is bright and natural, reflecting a trustworthy and approachable demeanor. The background is a simple, out-of-focus light gray, emphasizing the professional context." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCvsaN1N5b1oUPJurtNL19OQr7daqRBdFKU9YoOrv6JYFCEIJC4Dd8HgtLOeo532xgKI39HCtEVukkplU9RKMTBaNMjAX7Sp-EcJoifbUynCXryPPT1kd6OnxJAslnc9GzpyLgIZ2-6Bc14yBa-Uo59NnqBv5DKuOQCRCUgNvzviWf939GxKhhqtNj-Eyifr9gVlr_f_RCX_itMF66-DvzaY5qpc5pc6GWx9VspzCXLeK7uIOOz5VSHBu3eViAD4EVS70P4JAtbxzhN"/>
<div class="absolute -bottom-1 -right-1 w-5 h-5 bg-primary rounded-full border-2 border-white flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[12px]" style="font-variation-settings: 'FILL' 1;">directions_car</span>
</div>
</div>
<div class="bg-surface text-primary font-label-sm text-label-sm px-2 py-1 rounded-full shadow-sm mt-1 whitespace-nowrap">
                    في الطريق
                </div>
</div>
<!-- Route Line (Decorative SVG) -->
<svg class="absolute inset-0 w-full h-full" style="z-index: -1;">
<path class="animate-[dash_1s_linear_infinite]" d="M 50% 25% Q 40% 40% 33.33% 50%" fill="transparent" stroke="theme('colors.primary')" stroke-dasharray="8 8" stroke-width="4"></path>
</svg>
</div>
</main>
<!-- Bottom Sheet Card -->
<div class="fixed bottom-0 w-full z-20 bg-surface rounded-t-[24px] shadow-[0_-4px_24px_rgba(0,0,0,0.08)] flex flex-col transition-transform duration-300 transform translate-y-0 pb-safe">
<!-- Drag Handle -->
<div class="w-full flex justify-center py-sm cursor-grab">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<div class="px-margin-mobile pb-lg flex flex-col gap-md">
<!-- Status Header -->
<div class="flex justify-between items-center">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">عمر بابكر</h2>
<p class="font-body-md text-body-md text-on-surface-variant">سباك معتمد</p>
</div>
<div class="bg-primary-container text-on-primary-container px-sm py-xs rounded-lg flex flex-col items-center justify-center min-w-[80px]">
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold">15</span>
<span class="font-label-sm text-label-sm">دقيقة</span>
</div>
</div>
<!-- Tracking Status Steps -->
<div class="flex items-center justify-between relative mt-sm">
<!-- Line Behind -->
<div class="absolute top-1/2 left-0 right-0 h-[2px] bg-outline-variant -z-10 transform -translate-y-1/2 mx-4"></div>
<!-- Active Progress Line -->
<div class="absolute top-1/2 right-0 w-[50%] h-[3px] bg-primary -z-10 transform -translate-y-1/2 mx-4 transition-all duration-500"></div>
<div class="flex flex-col items-center gap-1 z-10 bg-surface px-1">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-white">
<span class="material-symbols-outlined text-[14px]">check</span>
</div>
<span class="font-label-sm text-label-sm text-primary">تم القبول</span>
</div>
<div class="flex flex-col items-center gap-1 z-10 bg-surface px-1">
<div class="w-8 h-8 rounded-full bg-primary-fixed border-4 border-surface flex items-center justify-center relative">
<div class="absolute inset-0 rounded-full border-2 border-primary animate-ping opacity-75"></div>
<div class="w-3 h-3 bg-primary rounded-full"></div>
</div>
<span class="font-label-sm text-label-sm text-primary font-bold">في الطريق</span>
</div>
<div class="flex flex-col items-center gap-1 z-10 bg-surface px-1">
<div class="w-6 h-6 rounded-full bg-surface-container-highest border border-outline-variant flex items-center justify-center text-outline">
</div>
<span class="font-label-sm text-label-sm text-outline">الوصول</span>
</div>
</div>
<!-- Vehicle Info Card -->
<div class="bg-surface-gray-light border border-outline-variant rounded-xl p-sm flex items-center gap-sm mt-sm">
<div class="w-12 h-12 bg-surface-container rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-[28px]">two_wheeler</span>
</div>
<div class="flex-grow">
<p class="font-body-md text-body-md font-bold text-on-surface">موتر سوزوكي - أزرق</p>
<p class="font-label-md text-label-md text-on-surface-variant tracking-widest">خ ر 1234</p>
</div>
<div class="bg-surface-white px-2 py-1 rounded border border-outline-variant shadow-sm flex items-center gap-1">
<span class="material-symbols-outlined text-warning-amber text-[16px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-label-md text-label-md font-bold text-on-surface">4.8</span>
</div>
</div>
<!-- Actions -->
<div class="flex gap-sm mt-xs">
<button class="flex-grow h-[48px] bg-primary text-white rounded-lg font-label-md text-label-md font-bold flex items-center justify-center gap-2 hover:bg-nile-blue-deep transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">call</span>
                    اتصال
                </button>
<button class="flex-grow h-[48px] bg-primary-fixed text-on-primary-fixed-variant border border-primary-fixed-dim rounded-lg font-label-md text-label-md font-bold flex items-center justify-center gap-2 hover:bg-primary-fixed-dim transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">chat</span>
                    رسالة
                </button>
</div>
<div class="w-full flex justify-center mt-2">
<button class="text-error-red font-label-md text-label-md flex items-center gap-1 p-2 hover:bg-error-container rounded transition-colors">
<span class="material-symbols-outlined text-[18px]">cancel</span>
                    إلغاء الطلب
                 </button>
</div>
</div>
</div>
<style>
        @keyframes dash {
          to {
            stroke-dashoffset: -16;
          }
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }
    </style>
</body></html>
